<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portofolio Vita</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="container">
            <div class="logo">VitaPortofolio.</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="contact-section">
        <div class="container">
            <h2>Hubungi Saya</h2>
            <form id="contactForm" class="contact-form">
                <div class="input-group">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" placeholder="Masukkan nama Anda">
                    <span class="error-msg" id="nameError"></span>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="contoh@email.com">
                    <span class="error-msg" id="emailError"></span>
                </div>
                <div class="input-group">
                    <label for="message">Pesan</label>
                    <textarea id="message" rows="5" placeholder="Tulis pesan Anda di sini..."></textarea>
                    <span class="error-msg" id="messageError"></span>
                </div>
                <button type="submit" class="btn">Kirim Pesan</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Vita Ervina Dzalfa | Dibuat guna memenuhi tugas mata kuliah PPBO</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
