<!DOCTYPE html>
<html>
    <head>
        <title>kalkulator Sederhana</title>
        <style>
            body {font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; 
            max-width: 400px; margin: 50px auto; padding: 20px; 
            background-image: url('kalkulatorbiasa.jpg'); 
                background-size: cover; 
                background-position: center; 
                background-attachment: fixed;}
            .kalkulator {background:rgb(240, 237, 234); padding: 30px; 
                border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0,1); text-align:center;}
            input {padding: 10px; margin: 5px; font-size: 16px; 
                width: 80%; box-sizing: border-box;}
            button {padding: 10px 15px; margin: 5px; font-size: 16px; 
                background: #546672; color: white; border: none; 
                border-radius: 5px; cursor: pointer;}
            button:hover {background: #ffc3f9;}
            .hasil {font-size: 28px; font-weight: bold; color: #2b3845; margin-top: 20px;}
        </style>
    </head>

    <body>
        <div class="kalkulator">
            <h2>Kalkulator</h2>

            <input type="number" id="angka1" placeholder="Masukkan Angka Pertama"><br>
            <input type="number" id="angka2" placeholder="Masukkan Angka Kedua"><br><br>

            <button onclick="tambah()">+</button>
            <button onclick="kurang()">-</button>
            <button onclick="kali()">x</button>
            <button onclick="bagi()">÷</button>
            <button onclick="reset()" style="background: #375f39;">Reset</button>

            <div class="hasil">Hasil: <span id="hasilAngka">0</span></div>
        </div>

        <script>
            function tambah() {
                let a=parseFloat(document.getElementById('angka1').value);
                let b=parseFloat(document.getElementById('angka2').value);
                document.getElementById('hasilAngka').innerHTML=a+b;               
            }

            function kurang() {
                let a=parseFloat(document.getElementById('angka1').value);
                let b=parseFloat(document.getElementById('angka2').value);
                document.getElementById('hasilAngka').innerHTML=a-b;
            }
            
            function kali() {
                let a=parseFloat(document.getElementById('angka1').value);
                let b=parseFloat(document.getElementById('angka2').value);
                document.getElementById('hasilAngka').innerHTML=a*b;
            }

            function bagi() {
                let a=parseFloat(document.getElementById('angka1').value);
                let b=parseFloat(document.getElementById('angka2').value);
                if (b===0) {
                    alert('Peringatan: Tidak bisa membagi dengan angka 0!');
                    return
                }
                document.getElementById('hasilAngka').innerHTML=a/b;
            }

            function reset() {
                document.getElementById('angka1').value='';
                document.getElementById('angka2').value='';
                document.getElementById('hasilAngka').innerHTML='0';
            }
        </script>
    </body>

</html>
