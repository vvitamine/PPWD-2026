<!DOCTYPE html> 
<html lang="id"> 
<head>
    <meta charset="UTF-8">

<body>
    <header>
        <h1>DAFTAR LAGU</h1>
        <div class="carilagu">
            <label for="cari">Cari judul lagu</label>
            <input type="text" id="cari" placeholder="masukkan judul lagu">
            <button type="search" id="btnCari"> </button>
    </header>

    <main>
        <form id="InformasiLagu">
            <fieldset>
                <legend>Edit Lagu</legend>

                <div class="laguInput">
                    <label for="judul">Judul Lagu:</label>
                    <input type="text" id="judul" placeholder="Masukkan judul lagu">
                </div>

                <div class="laguInput">
                    <label for="penyanyi">Penyanyi:</label>
                    <input type="text" id="penyanyi" placeholder="Masukkan penyanyi lagu">
                </div>

                <div class="laguInput">
                    <label for="genre">genre lagu:</label>
                    <select id="genre">
                        <option value=" ">--Pilih Genre--</option>
                        <option value="pop">genre Pop</option>
                        <option value="rnb">genre Rnb</option>
                        <option value="rock">genre Rock</option>
                        <option value="alternative">genre Alternatif</option>
                    </select>
                </div>

                <div class="tombol">
                    <button type="submit" id="btnSubmit">Submit</button>
                    <button type="reset" id="btnReset">Reset</button>
                </div>
            </fieldset>

            <fieldset>
                <legend>Daftar Lagu:</legend>
                <div class="lagu">
                    <label for="lagu">
                       <p><b><font color="blue">contoh </font></b></p>
                       <table border="1" cellpadding="8" bgcolor="#e2ebff" width="100%" bordercolor="black" style="border-collapse:collapse">
                        <tr>
                            <td>
                                <table border="1" cellpadding="8" bgcolor="#e2ebff" width="80%" bordercolor="black" style="border-collapse:collapse">
                                    <tr bgcolor="pink">
                                        <td><b>Judul Lagu</b></td>
                                        <td><b>Nama Penyanyi</b></td>
                                    </tr>
                                    <tr><td>Balonku</td><td>Velixza</td></tr>
                                    <tr><td>Indonesia Raya</td><td>WR.Supratman</td></tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </label>
            </div>
            </fieldset>
    </main>
    <footer>
        <p>&copy; 2026||Daftar Lagu. Dibuat untuk UTS.</p>
    </footer>

    <script src="UTS.js"></script>
